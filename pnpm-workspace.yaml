# pnpm 12 fail-closed defaults, relaxed identically for every bench run (pnpm 10
# accepts both keys): dependency build scripts never run (hermetic installs; without
# this pnpm 12 exits 1 with ERR_PNPM_IGNORED_BUILDS on the blocked sharp build where
# pnpm 10 warned and exited 0), and the supply-chain minimum-release-age gate is off
# (its trigger depends on registry publish times relative to the run, which would
# make bench results time-dependent; ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION).
ignoreScripts: true
minimumReleaseAge: 0

packages:
  - "apps/*"
  - "packages/*"

# Catalogs give every one of the 10k apps + 300 libs a single source of
# truth for shared dependency versions. This is the #1 lever for keeping the
# lockfile small and the store deduplicated at scale.
catalog:
  next: 16.2.9
  react: 19.2.7
  react-dom: 19.2.7
  typescript: 6.0.3
  "@types/node": ^25.0.0
  "@types/react": 19.2.17
  # Exact pin, no caret: a floating ^19 range drifts — @types/react-dom 19.3.0 raised
  # its @types/react peer to ^19.3.0, which ERESOLVEs against the 19.2.17 pin above on
  # the npm leg of container-install-bench. 19.2.7 is the newest version whose peer
  # range (^19.2.0) accepts @types/react 19.2.17.
  "@types/react-dom": 19.2.7
  vite: 8.0.16
  "@vitejs/plugin-react": 6.0.2
