<svg xmlns="http://www.w3.org/2000/svg" width="660" height="262" viewBox="0 0 660 262" role="img" aria-label="The thesis: an unscoped whole-repo command runs a task for every package (30,708 tasks on the 30,000-app fleet), while a scoped command runs one app's dependency closure (121 tasks at the largest measured layered scale)." font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
