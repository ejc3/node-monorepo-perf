}</style>
<rect width="660" height="262" fill="#ffffff"/>
<text x="16" y="22" font-size="13" fill="#1c2330" font-weight="600">O(repo): the unscoped command</text>
<text x="356" y="22" font-size="13" fill="#1c2330" font-weight="600">O(closure): the scoped command</text>
<rect x="16" y="38" width="288" height="46" rx="7" fill="#eef3fb" stroke="#b9cdec" stroke-width="1.2"/>
<text x="30" y="58" font-size="12" fill="#1c2330" font-weight="600">turbo run typecheck</text>
<text x="30" y="74" font-size="10.5" fill="#1c2330">no filter — every package is selected</text>
<rect x="356" y="38" width="288" height="46" rx="7" fill="#eef3fb" stroke="#b9cdec" stroke-width="1.2"/>
<text x="370" y="58" font-size="11" fill="#1c2330" font-weight="600">turbo run build --filter=@demo/app-2000...</text>
<text x="370" y="74" font-size="10.5" fill="#1c2330">one app + its dependency closure</text>
