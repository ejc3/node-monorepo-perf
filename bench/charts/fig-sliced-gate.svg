<svg xmlns="http://www.w3.org/2000/svg" width="668" height="500" viewBox="0 0 668 500" role="img" aria-label="The sliced gate: one tsgo program over the whole workspace versus K concurrent slices, with a union check proving the sliced verdict identical to the whole-program one. On 64 cores the one program takes 58.2s (51.2GB RSS, 786% CPU) and 32 slices take 10.3s at up to 2.2GB each; on 192 cores the one program takes 67.7s (52.7GB RSS) and 48 slices take 6.2s at up to 1.6GB each. One run per machine: 64 vs 192 cores is a cross-machine observation, not a controlled core-scaling experiment." font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" style="font-variant-numeric:tabular-nums">
