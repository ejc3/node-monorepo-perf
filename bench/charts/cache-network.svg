<svg xmlns="http://www.w3.org/2000/svg" width="742" height="332" viewBox="0 0 742 332" role="img" aria-label="Remote cache restore versus cold compute across network profiles: rows are tasks with their cache size, columns are cold compute plus each shaped restore profile; each cell shows its time and its multiple of the row's fastest. A shared Turborepo cache beats cold compute on every link tested (4.5–7.1×); the cross-region link (500 Mbps · 30 ms RTT) adds 0.2s to the 0.2 MB typecheck restore and adds 1.8s to the 247 MB build restore." font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" style="font-variant-numeric:tabular-nums">
