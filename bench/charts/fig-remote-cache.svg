<text x="16" y="24" font-size="17" fill="#1c2330" font-weight="650">A shared cache: one runner seeds, the rest restore</text>
<text x="16" y="42" font-size="12" fill="#6b7885">192 cores · turborepo-remote-cache@2.11.2 on localhost: restore without network latency</text>
<rect x="16" y="62" width="178" height="70" rx="6" fill="#fcf4f0" stroke="#e2c0b0" stroke-width="1"/>
