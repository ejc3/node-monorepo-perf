<svg xmlns="http://www.w3.org/2000/svg" width="660" height="426" viewBox="0 0 660 426" role="img" aria-label="A shared Turborepo cache: the first runner computes every task and uploads the outputs, and every later runner with the same task inputs restores them instead of recomputing (typecheck at 300 apps: 1.5s restore versus 9.9s no-cache cold). After a leaf-lib edit 486 of 500 tasks still restore; after a foundation-lib edit 0 do." font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
