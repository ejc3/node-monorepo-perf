}</style>
<rect width="660" height="426" fill="#ffffff"/>
<text x="16" y="22" font-size="13" fill="#1c2330" font-weight="600">a shared cache: one runner seeds, the rest restore</text>
<text x="16" y="39" font-size="10.5" fill="#6b7885">192 cores · turborepo-remote-cache@2.11.2 on localhost: restore with no network latency</text>
<rect x="16" y="54" width="178" height="70" rx="7" fill="#fdf3ef" stroke="#e4b9a6" stroke-width="1.2"/>
