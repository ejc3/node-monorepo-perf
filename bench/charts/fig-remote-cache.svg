rect[fill="#e4e8ec"]{fill:#2b333c}
line[stroke="#6b7885"],path[stroke="#6b7885"],polyline[stroke="#6b7885"]{stroke:#8b98a4}
path[fill="#6b7885"]{fill:#8b98a4}
