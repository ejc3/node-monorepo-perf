<svg xmlns="http://www.w3.org/2000/svg" width="668" height="323" viewBox="0 0 668 323" role="img" aria-label="The save loop by mechanic at 1,000,000 modules, on a log time axis: tsgo's CLI incremental rerun relaunches and returns a verdict in 53.7s, its --watch rebuild in 22.6s, its LSP shows a seeded error in the open file in 2.4s, and Flow's resident server rechecks one edit in 324ms; each lane also marks its one-time entry cost. CLI, --watch and Flow: a valid one-module edit, verdict over the whole program. LSP: an edit that seeds a type error, verdict for the open file only." font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" style="font-variant-numeric:tabular-nums">
