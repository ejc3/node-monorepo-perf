<svg xmlns="http://www.w3.org/2000/svg" width="660" height="344" viewBox="0 0 660 344" role="img" aria-label="What each linker materializes for the same 2,000-app workspace: a hoisted linker writes one flat node_modules at the root (24,222 entries under pnpm, 13,220 under yarn), pnpm's isolated linker writes a per-package symlink tree over a virtual store linked from the content-addressable store (50,169 entries), and yarn Plug'n'Play writes no node_modules tree, only a .pnp.cjs resolver table over cache zips and unplugged native packages (64 entries, all inside the unplugged packages)." font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
