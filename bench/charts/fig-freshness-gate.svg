<svg xmlns="http://www.w3.org/2000/svg" width="668" height="328" viewBox="0 0 668 328" role="img" aria-label="The freshness gate for checked-in codegen artifacts: a no-change relay-compiler run, then git status over the generated directory; nothing listed means the artifacts are byte-stable and the gate passes, a changed or untracked path means an edited query drifted from its artifact and the gate fails. One pass costs 3.0s at 10,000 components and 9.5s at 30,000." font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" style="font-variant-numeric:tabular-nums">
<style>@media (prefers-color-scheme: dark){
rect[fill="#ffffff"]{fill:#0d1117}
text[fill="#1c2330"]{fill:#e2e7ec}
text[fill="#6b7885"]{fill:#9aa6b1}
text[fill="#1a73e8"]{fill:#6ba3f5}
