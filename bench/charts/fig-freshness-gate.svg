text[fill="#3a4656"]{fill:#a7b6c8}
}</style>
<rect width="668" height="328" fill="#ffffff"/>
<g transform="translate(4 0)">
<text x="16" y="24" font-size="17" fill="#1c2330" font-weight="650">The freshness gate for checked-in codegen artifacts</text>
<rect x="16" y="50" width="160" height="74" rx="6" fill="#f3f6fb" stroke="#c5d4ea" stroke-width="1"/>
<text x="27" y="68" font-size="12" fill="#1c2330" font-weight="600">PR head</text>
<text x="27" y="83" font-size="11" fill="#1c2330">components + committed</text>
<text x="27" y="97" font-size="11" fill="#1c2330">__generated__ artifacts</text>
<rect x="230" y="50" width="182" height="74" rx="6" fill="#f3f6fb" stroke="#c5d4ea" stroke-width="1"/>
<text x="241" y="68" font-size="12" fill="#1c2330" font-weight="600">relay-compiler</text>
<text x="241" y="83" font-size="11" fill="#1c2330">no-change run, re-validates</text>
<text x="241" y="97" font-size="11" fill="#1c2330">every document</text>
<text x="241" y="113" font-size="11" fill="#46505b">9.5s at 30,000</text>
<rect x="464" y="50" width="180" height="74" rx="6" fill="#f3f6fb" stroke="#c5d4ea" stroke-width="1"/>
<text x="475" y="68" font-size="12" fill="#1c2330" font-weight="600">git status --porcelain</text>
<text x="475" y="83" font-size="11" fill="#1c2330">-- src/__generated__</text>
<text x="475" y="97" font-size="11" fill="#1c2330">lists untracked paths too</text>
<text x="475" y="113" font-size="11" fill="#46505b">38ms at 30,000</text>
<line x1="178" y1="87" x2="221.5" y2="87" stroke="#8794a1" stroke-width="1.25"/><path d="M228 87L221.5 90L221.5 84z" fill="#8794a1"/>
<text x="203" y="80" font-size="10" fill="#6b7885" text-anchor="middle">in CI</text>
<line x1="414" y1="87" x2="455.5" y2="87" stroke="#8794a1" stroke-width="1.25"/><path d="M462 87L455.5 90L455.5 84z" fill="#8794a1"/>
<rect x="444" y="176" width="200" height="60" rx="6" fill="#f1f9f4" stroke="#b2d8c1" stroke-width="1"/>
<text x="455" y="194" font-size="12" fill="#1c2330" font-weight="600">clean: the gate passes</text>
<text x="455" y="209" font-size="11" fill="#1c2330">byte-stable on every timed</text>
<text x="455" y="223" font-size="11" fill="#1c2330">no-change rerun</text>
<rect x="206" y="176" width="206" height="60" rx="6" fill="#fcf4f0" stroke="#e2c0b0" stroke-width="1"/>
<text x="217" y="194" font-size="12" fill="#1c2330" font-weight="600">dirty: the gate fails</text>
<text x="217" y="209" font-size="11" fill="#1c2330">an edited query changes its</text>
<text x="217" y="223" font-size="11" fill="#1c2330">artifact: the drift is caught</text>
<line x1="555" y1="126" x2="555" y2="167.5" stroke="#8794a1" stroke-width="1.25"/><path d="M555 174L552 167.5L558 167.5z" fill="#8794a1"/>
<text x="563" y="152" font-size="10" fill="#6b7885" text-anchor="start">nothing listed</text>
<line x1="486" y1="126" x2="350.2" y2="171.9" stroke="#8794a1" stroke-width="1.25"/><path d="M344 174L349.2 169.1L351.1 174.8z" fill="#8794a1"/>
<text x="374" y="140" font-size="10" fill="#6b7885" text-anchor="end">a changed or</text>
<text x="374" y="153" font-size="10" fill="#6b7885" text-anchor="end">untracked path</text>
<path d="M204 206L198 206M192.7 206L186.7 206M181.3 206L175.3 206M170 206L164 206M158.7 206L152.7 206M147.3 206L141.3 206M136 206L130 206M124.7 206L118.7 206M113.3 206L107.3 206M102 206L96 206" stroke="#8794a1" stroke-width="1.25" fill="none"/>
<path d="M96 206L96 200M96 194.8L96 188.8M96 183.5L96 177.5M96 172.3L96 166.3M96 161L96 155M96 149.8L96 143.8M96 138.5L96 132.5" stroke="#8794a1" stroke-width="1.25" fill="none"/><path d="M96 126L99 132.5L93 132.5z" fill="#8794a1"/>
<text x="104" y="154" font-size="10" fill="#6b7885" text-anchor="start">regenerate,</text>
<text x="104" y="167" font-size="10" fill="#6b7885" text-anchor="start">commit</text>
<text x="16" y="266" font-size="12" fill="#1c2330" font-weight="600">one gate pass</text>
<text x="140" y="266" font-size="13" fill="#1c2330" font-weight="650">3.0s at 10,000 components</text>
<text x="140" y="282" font-size="10" fill="#6b7885">median of 3 samples</text>
<text x="400" y="266" font-size="13" fill="#1c2330" font-weight="650">9.5s at 30,000</text>
<text x="400" y="282" font-size="10" fill="#6b7885">fleet anchor, 1 sample</text>
<line x1="16" y1="302" x2="644" y2="302" stroke="#e4e8ec"/>
<text x="16" y="316" font-size="10" fill="#6b7885">data: bench/relay-codegen-bench.json · relay-compiler 21.0.1 · 192 cores</text>
</g>
</svg>
