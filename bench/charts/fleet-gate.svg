<rect width="668" height="339" fill="#ffffff"/>
<text x="20" y="24" font-size="17" fill="#1c2330" font-weight="650">The worst case on two machines</text>
<text x="20" y="42" font-size="12" fill="#6b7885">a foundation rev on the 30,000-app fleet: one checker process vs the per-package pipeline</text>
<rect x="20" y="55" width="12" height="10" rx="2" fill="#3f4b5b"/>
<text x="37" y="64" font-size="10" fill="#6b7885">64 cores</text>
<rect x="96.32000000000001" y="55" width="12" height="10" rx="2" fill="#7a8899"/>
<text x="113.32000000000001" y="64" font-size="10" fill="#6b7885">192 cores</text>
<text x="20" y="103" font-size="12" fill="#1c2330" font-weight="600">one checker process</text>
<text x="20" y="118" font-size="10" fill="#6b7885">the whole workspace's source, once</text>
<rect x="216" y="92" width="27.5" height="13" rx="2" fill="#3f4b5b"/>
<text x="250.5" y="102.5" font-size="11" fill="#1c2330" font-weight="600">58.1s</text>
<rect x="216" y="110" width="31.5" height="13" rx="2" fill="#7a8899"/>
<text x="254.5" y="120.5" font-size="11" fill="#1c2330" font-weight="600">66.6s</text>
<text x="648" y="118" font-size="10" fill="#6b7885" text-anchor="end">×1.1 slower on 192 cores</text>
<text x="20" y="161" font-size="12" fill="#1c2330" font-weight="600">per-package pipeline</text>
<text x="20" y="176" font-size="10" fill="#6b7885">30,708 tasks, incl. 460 lib builds</text>
<rect x="216" y="150" width="300" height="13" rx="2" fill="#3f4b5b"/>
<text x="523" y="160.5" font-size="11" fill="#1c2330" font-weight="600">10.6 min</text>
<rect x="216" y="168" width="164.9" height="13" rx="2" fill="#7a8899"/>
<text x="387.9" y="178.5" font-size="11" fill="#1c2330" font-weight="600">5.8 min</text>
<text x="648" y="176" font-size="10" fill="#6b7885" text-anchor="end">×1.8 faster on 192 cores</text>
<line x1="216" y1="86" x2="216" y2="190" stroke="#e4e8ec"/>
<text x="216" y="204" font-size="10" fill="#6b7885" text-anchor="middle">0</text>
<line x1="358" y1="86" x2="358" y2="190" stroke="#e4e8ec"/>
<text x="358" y="204" font-size="10" fill="#6b7885" text-anchor="middle">5 min</text>
<line x1="500" y1="86" x2="500" y2="190" stroke="#e4e8ec"/>
<text x="500" y="204" font-size="10" fill="#6b7885" text-anchor="middle">10 min</text>
<text x="20" y="226" font-size="10" fill="#6b7885">Not like-for-like: the pipeline also builds each lib's dist; the one checker process only type-checks.</text>
<text x="20" y="241" font-size="10" fill="#6b7885">One run per machine: a cross-machine observation, not a controlled core-scaling experiment.</text>
<text x="20" y="256" font-size="10" fill="#6b7885">The pipeline rows also ran different bun versions (1.3.14 / 1.4.2), which start every task.</text>
<text x="20" y="278" font-size="10" fill="#6b7885">Also on the 64-core box: install 181s (bun, warm store) · lint 2.4s (oxlint) · breaking rev caught in 58.9s</text>
<text x="20" y="293" font-size="10" fill="#6b7885">bun 1.3.14 (64-core) / 1.4.2 (192-core) · turbo 2.9.18 · tsgo 7.0.2 · oxlint 1.86.0 · node 22.23.3</text>
<line x1="20" y1="313" x2="648" y2="313" stroke="#e4e8ec"/>
<text x="20" y="327" font-size="10" fill="#6b7885">data: bench/fleet-gate-bench.json · bench/fleet-gate-bench.pbox.json · bench/fleet-shape.json</text>
