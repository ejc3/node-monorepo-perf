<svg xmlns="http://www.w3.org/2000/svg" width="668" height="339" viewBox="0 0 668 339" role="img" aria-label="The worst case on two machines: a foundation rev on the 30,000-app fleet checked by one checker process in 58.1s on 64 cores and 66.6s on 192, and by the per-package pipeline in 10.6 min and 5.8 min. Not like-for-like: the pipeline also builds each lib's dist; the one checker process only type-checks. One run per machine: a cross-machine observation, not a controlled core-scaling experiment. The pipeline rows also ran different bun versions (1.3.14 / 1.4.2), which start every task." font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" style="font-variant-numeric:tabular-nums">
