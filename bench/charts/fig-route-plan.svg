<rect width="668" height="490" fill="#ffffff"/>
<g transform="translate(4 0)">
<text x="16" y="24" font-size="17" fill="#1c2330" font-weight="650">One plan call</text>
<text x="16" y="42" font-size="12" fill="#6b7885">the long trip: 13 searches, 127 simulations of 300 mornings, 5 routes back</text>
<rect x="16" y="54" width="628" height="44" rx="6" fill="#f3f6fb" stroke="#c5d4ea" stroke-width="1"/>
<text x="27" y="72" font-size="12" fill="#1c2330" font-weight="600">Snap the ends</text>
<text x="27" y="87" font-size="11" fill="#1c2330">each end to the nearer end of the nearest road a car can start on (no freeway, trunk road or ramp)</text>
<line x1="330" y1="100" x2="330" y2="107.5" stroke="#8794a1" stroke-width="1.25"/><path d="M330 114L327 107.5L333 107.5z" fill="#8794a1"/>
<rect x="16" y="116" width="628" height="114" rx="6" fill="#f3f6fb" stroke="#c5d4ea" stroke-width="1"/>
<text x="27" y="134" font-size="12" fill="#1c2330" font-weight="600">Search: the beaten route and the alternatives</text>
<text x="27" y="149" font-size="11" fill="#1c2330">one search with junctions priced flat (signal 15 s, all-way stop 8 s, stop 6 s, yield 2 s): the route a typical</text>
<text x="27" y="163" font-size="11" fill="#1c2330">router gives</text>
<text x="27" y="177" font-size="11" fill="#1c2330">then, at risk 0 and at risk 1.5, up to 4 alternatives each: search, make every edge used 1.35 times dearer,</text>
<text x="27" y="191" font-size="11" fill="#1c2330">search again (at most 12 tries); keep a route sharing under 75% of its length with each kept</text>
<text x="27" y="205" font-size="11" fill="#1c2330">routes priced at 8:35, 25 minutes before the arrival; a candidate sharing 90% with one already taken both</text>
<text x="27" y="219" font-size="11" fill="#1c2330">ways is dropped</text>
<line x1="330" y1="232" x2="330" y2="239.5" stroke="#8794a1" stroke-width="1.25"/><path d="M330 246L327 239.5L333 239.5z" fill="#8794a1"/>
<rect x="16" y="248" width="628" height="58" rx="6" fill="#f1f9f4" stroke="#b2d8c1" stroke-width="1"/>
<text x="27" y="266" font-size="12" fill="#1c2330" font-weight="600">Price each route: 13 departures × 300 mornings</text>
<text x="27" y="281" font-size="11" fill="#1c2330">every 5 minutes over the 60 before the arrival, 300 mornings from the same seed: the share on time at each</text>
<text x="27" y="295" font-size="11" fill="#1c2330">a later departure is never likelier to arrive on time: a rise between two departures is held at the lower value</text>
<line x1="330" y1="308" x2="330" y2="315.5" stroke="#8794a1" stroke-width="1.25"/><path d="M330 322L327 315.5L333 315.5z" fill="#8794a1"/>
<rect x="16" y="324" width="628" height="58" rx="6" fill="#f1f9f4" stroke="#b2d8c1" stroke-width="1"/>
<text x="27" y="342" font-size="12" fill="#1c2330" font-weight="600">Leave-by</text>
<text x="27" y="357" font-size="11" fill="#1c2330">the latest departure whose on-time share reaches 95%, interpolated between two departures</text>
<text x="27" y="371" font-size="11" fill="#1c2330">then simulated as a whole minute on its own, stepping back a minute until it meets the goal</text>
<line x1="330" y1="384" x2="330" y2="391.5" stroke="#8794a1" stroke-width="1.25"/><path d="M330 398L327 391.5L333 391.5z" fill="#8794a1"/>
<rect x="16" y="400" width="628" height="44" rx="6" fill="#f3f6fb" stroke="#c5d4ea" stroke-width="1"/>
<text x="27" y="418" font-size="12" fill="#1c2330" font-weight="600">Rank and keep 5</text>
<text x="27" y="433" font-size="11" fill="#1c2330">latest safe departure first; the beaten route is always among them</text>
<line x1="16" y1="464" x2="644" y2="464" stroke="#e4e8ec"/>
<text x="16" y="478" font-size="10" fill="#6b7885">data: bench/route-planner-bench.json · bench/route-planner-fixes.json · c8g.8xlarge · Node 22.23.3</text>
</g>
</svg>
