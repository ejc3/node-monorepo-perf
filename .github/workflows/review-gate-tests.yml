name: review-gate-tests

# The merge gate's own test harness. It runs the PR's copy of the gate against fixtures and
# gh shims, so it needs no token beyond reading the repository and touches no live PR.

on:
  pull_request:
    paths:
      - ".claude/skills/pr-review-gate/**"
      - ".github/workflows/review-gate*.yml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - ".claude/skills/pr-review-gate/**"
      - ".github/workflows/review-gate*.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  harness:
    name: gate harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require jq, gh and python3 (the harness and the gate use all three)
        run: |
          command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
          jq --version
          gh --version | head -1
          python3 --version

      - name: Run the harness
        run: make test-review-gate
